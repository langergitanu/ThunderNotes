# JVM args for the Gradle daemon — generous heap so Room/KSP don't OOM on big builds.
# NOTE (sandbox adaptation): lowered from -Xmx4g → -Xmx2g for this 4GB-RAM/no-swap build host.
# On a real dev machine (≥8GB), restore: org.gradle.jvmargs=-Xmx4g -XX:+UseParallelGC -Dfile.encoding=UTF-8
org.gradle.jvmargs=-Xmx2g -XX:+UseParallelGC -Dfile.encoding=UTF-8

# Build performance
# NOTE (sandbox adaptation): parallel + configuration-cache disabled to cut peak memory on a 4GB host.
# On a real dev machine, restore both to true for faster builds.
org.gradle.parallel=false
org.gradle.caching=true
org.gradle.configuration-cache=false

# AndroidX
android.useAndroidX=true
android.nonTransitiveRClass=true

# Kotlin
kotlin.code.style=official
kotlin.incremental=true
# Run the Kotlin compiler in-process (shares the Gradle daemon heap) so a 4GB/no-swap
# host doesn't have to run Gradle daemon + Kotlin daemon + KSP as 3 separate JVMs.
# On a real dev machine this can be removed (default daemon strategy is faster).
kotlin.compiler.execution.strategy=in-process

# Disable build features we don't use yet (saves config time)
android.defaults.buildfeatures.aidl=false
android.defaults.buildfeatures.renderscript=false

# ─── AGP 9 compatibility flags (added 2026-10-05 per BigPickle report B2) ────
# AGP 9 enables "built-in Kotlin" by default, but KSP (needed for Room) is not
# compatible with it. Opt out and use the standalone Kotlin Gradle plugin.
# ⚠️ DEPRECATED by AGP 9 — will be removed in version 10.0. Will need rework
# before upgrading to AGP 10.
android.builtInKotlin=false
# The standalone Kotlin plugin (required by KSP/Room) does not support the
# AGP 9.0 new DSL yet. Keep the legacy DSL so kotlin("android") + KSP can apply.
android.newDsl=false
